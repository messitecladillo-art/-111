<body>
<div id="frame">
  <div id="cam">
    <canvas id="bg" width="1920" height="1080"></canvas>
    <div id="stage"></div>
  </div>
  <canvas id="post" width="1920" height="1080"></canvas>
</div>
<script>
'use strict';
const W = 1920, H = 1080, CX = 960, CY = 500;
const ASSET = '../../apps/frontend/public/landing/';
const BRAND = '../../skill/zhengda-cup-champion/assets/brand/';

/* ——— math ——— */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeInCubic = t => t * t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/** Envelope that is 1 inside [a, b] with linear ramps of length fin / fout. */
const env = (t, a, b, fin = .6, fout = .5) => (t < a || t > b) ? 0 : Math.min(1, (t - a) / fin, (b - t) / fout);

/* ——— DOM helpers ——— */
const stage = document.getElementById('stage');
function el(tag, cls, parent = stage, html = '') { const n = document.createElement(tag); if (cls) n.className = cls; n.innerHTML = html; parent.appendChild(n); return n; }
function split(node, text) { node.textContent = ''; node._chars = [...text].map(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; node.appendChild(s); return s; }); return node; }
function show(node, on) { if (node.classList.contains('layer')) node.style.display = on ? 'block' : 'none'; else node.style.visibility = on ? 'visible' : 'hidden'; }
/** Character-staggered entrance and exit. */
function lineFx(node, t, tin, tout, o = {}) {
  const st = o.stagger ?? .045, du = o.dur ?? .75, dy = o.dy ?? 34, bl = o.blur ?? 14, od = o.outDur ?? .45;
  if (t < tin || t > tout + od) { show(node, false); return; }
  show(node, true);
  const q = clamp((t - tout) / od);
  node._chars.forEach((c, k) => {
    const p = clamp((t - tin - k * st) / du), e = easeOutCubic(p);
    c.style.opacity = (e * (1 - q)).toFixed(3);
    c.style.transform = `translateY(${((1 - e) * dy - q * 12).toFixed(1)}px) scale(${(1 + (1 - e) * .12).toFixed(3)})`;
    const b = (1 - p) * bl + q * 8;
    c.style.filter = b > .05 ? `blur(${b.toFixed(1)}px)` : 'none';
  });
}
function fadeFx(node, t, tin, tout, o = {}) {
  const fin = o.fin ?? .6, fout = o.fout ?? .5, dy = o.dy ?? 20, bl = o.blur ?? 10;
  const v = env(t, tin, tout, fin, fout);
  if (v <= 0) { show(node, false); return 0; }
  show(node, true);
  const e = easeOutCubic(v);
  node.style.opacity = e.toFixed(3);
  node.style.transform = `translateY(${((1 - e) * dy).toFixed(1)}px)` + (o.extra ? ' ' + o.extra : '');
  node.style.filter = (1 - e) * bl > .05 ? `blur(${((1 - e) * bl).toFixed(1)}px)` : 'none';
  return e;
}

/* ——— assets ——— */
let C; // cues
const IMG = {};
function loadImg(key, src) { return new Promise(res => { const i = new Image(); i.onload = () => i.decode().then(() => res(i), () => res(i)); i.onerror = () => res(null); i.src = src; IMG[key] = i; }); }

/* ——— particles ——— */
const N = 7200;
const rng = mulberry32(20261011);
const R1 = new Float32Array(N), R2 = new Float32Array(N), R3 = new Float32Array(N), R4 = new Float32Array(N), R5 = new Float32Array(N), SIZE = new Float32Array(N), KIND = new Uint8Array(N);
for (let i = 0; i < N; i++) { R1[i] = rng(); R2[i] = rng(); R3[i] = rng(); R4[i] = rng(); R5[i] = rng(); SIZE[i] = 5 + Math.pow(rng(), 2.6) * 16; const k = rng(); KIND[i] = k < .7 ? 0 : k < .9 ? 1 : 2; }
const SHAPES = {};

function sampleCanvas(draw, n, seed, jitter = 1.2) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; draw(g);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 140) pts.push(x, y);
  const r = mulberry32(seed), out = new Float32Array(n * 2), m = pts.length / 2;
  for (let i = 0; i < n; i++) { const k = Math.floor(r() * m); out[i * 2] = pts[k * 2] + (r() - .5) * 2 * jitter; out[i * 2 + 1] = pts[k * 2 + 1] + (r() - .5) * 2 * jitter; }
  return out;
}
function glyphShape(ch, seed) {
  return sampleCanvas(g => { g.font = '700 640px "Noto Serif CJK SC"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, CX, CY - 10); }, N, seed);
}
function buildShapes() {
  const spark = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) { const a = R1[i] * Math.PI * 2, r = Math.pow(R2[i], 2) * 10; spark[i * 2] = CX + Math.cos(a) * r; spark[i * 2 + 1] = CY + Math.sin(a) * r; }
  SHAPES.spark = spark;
  C.history.forEach((h, k) => { SHAPES['g' + k] = glyphShape(h.glyph, 11 + k); });
  SHAPES.title = sampleCanvas(g => { g.font = '700 300px "Noto Serif CJK SC"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(C.title.text, CX, CY); }, N, 31);
  const chaos = new Float32Array(N * 2), r = mulberry32(41);
  for (let i = 0; i < N; i++) { chaos[i * 2] = 60 + r() * (W - 120); chaos[i * 2 + 1] = 150 + r() * (H - 300); }
  SHAPES.chaos = chaos;
  SHAPES.question = sampleCanvas(g => {
    const marks = [[300, 360, 300, -.2], [720, 300, 200, .15], [1080, 420, 420, -.05], [1500, 330, 260, .2], [1700, 640, 180, -.1], [480, 690, 230, .1], [860, 720, 150, -.25], [1300, 700, 220, .05], [180, 560, 140, .3], [1840, 300, 120, -.3]];
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const [x, y, s, rot] of marks) { g.save(); g.translate(x, y); g.rotate(rot); g.font = `700 ${s}px "Noto Sans CJK SC"`; g.fillText('？', 0, 0); g.restore(); }
  }, N, 51, 1.5);
  // A receding plane: structure out of noise.
  const floor = new Float32Array(N * 2), cols = 120, rows = Math.ceil(N / cols);
  for (let i = 0; i < N; i++) { const u = i % cols, v = Math.floor(i / cols); const X = (u / (cols - 1) - .5) * 4200, Z = 260 + v * 34, f = 640; floor[i * 2] = CX + X * f / Z; floor[i * 2 + 1] = 380 + 520 * f / Z; }
  SHAPES.floor = floor;
  // Evidence network: nodes and the edges between them.
  const nr = mulberry32(61), nodes = [];
  for (let k = 0; k < 15; k++) nodes.push([260 + nr() * 1400, 210 + nr() * 560]);
  const edges = [];
  nodes.forEach((a, i) => { const d = nodes.map((b, j) => [Math.hypot(a[0] - b[0], a[1] - b[1]), j]).sort((p, q) => p[0] - q[0]); edges.push([i, d[1][1]], [i, d[2][1]]); });
  const net = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) {
    if (R5[i] < .55) { const nd = nodes[Math.floor(R1[i] * nodes.length)], a = R2[i] * Math.PI * 2, rr = Math.pow(R3[i], .7) * 46; net[i * 2] = nd[0] + Math.cos(a) * rr; net[i * 2 + 1] = nd[1] + Math.sin(a) * rr; }
    else { const e = edges[Math.floor(R1[i] * edges.length)], a = nodes[e[0]], b = nodes[e[1]], s = R2[i]; net[i * 2] = lerp(a[0], b[0], s) + (R3[i] - .5) * 4; net[i * 2 + 1] = lerp(a[1], b[1], s) + (R4[i] - .5) * 4; }
  }
  SHAPES.net = net; SHAPES.nodes = nodes;
}
let KF;
function particlePos(i, t, out) {
  if (t < 25) {
    let k = 0; while (k + 1 < KF.length && KF[k + 1].t <= t) k++;
    if (k === 0) { // spark breathing before the first burst
      const a = R1[i] * Math.PI * 2 + t * .4, r = Math.pow(R2[i], 2) * (6 + 4 * Math.sin(t * 2.4));
      out[0] = CX + Math.cos(a) * r; out[1] = CY + Math.sin(a) * r; return;
    }
    const A = KF[k - 1].s, B = KF[k].s, f = KF[k];
    const delay = R1[i] * (f.spread ?? .45), p = clamp((t - f.t - delay) / f.d), e = (f.ease || easeInOutCubic)(p);
    const ax = A[i * 2], ay = A[i * 2 + 1], bx = B[i * 2], by = B[i * 2 + 1];
    let x = lerp(ax, bx, e), y = lerp(ay, by, e);
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) + 1e-3, amp = (R2[i] - .5) * len * (f.swirl ?? .4) * Math.sin(Math.PI * e);
    x += -dy / len * amp; y += dx / len * amp;
    x += Math.sin(t * 1.3 + R3[i] * 6.283) * 1.4; y += Math.cos(t * 1.1 + R4[i] * 6.283) * 1.4;
    out[0] = x; out[1] = y; return;
  }
  if (t < 30) { // vortex into a single point
    const p = clamp((t - 25) / 4.35), e = Math.pow(p, 2.1), ang = e * (7 + 7 * R1[i]), sc = 1 - easeInCubic(p) * .997;
    const rx = SHAPES.net[i * 2] - CX, ry = SHAPES.net[i * 2 + 1] - CY;
    out[0] = CX + (rx * Math.cos(ang) - ry * Math.sin(ang)) * sc; out[1] = CY + (rx * Math.sin(ang) + ry * Math.cos(ang)) * sc; return;
  }
  const burst = (tt, o) => {
    const tau = tt - 30, a = R1[i] * Math.PI * 2;
    if (R5[i] < .74) { const ang = a + tau * .07, R = 360 * easeOutExpo(Math.min(1, tau / .8)) + Math.sin(ang * 7 + tau * 1.5) * 7 + (R2[i] - .5) * 30; o[0] = CX + Math.cos(ang) * R; o[1] = CY + Math.sin(ang) * R; }
    else { const dist = (220 + 1500 * R2[i]) * easeOutCubic(Math.min(1, tau / 2.4)); o[0] = CX + Math.cos(a) * dist; o[1] = CY + Math.sin(a) * dist; }
  };
  const ambient = (tt, o) => {
    const x = (R3[i] * (W + 80) + tt * (R1[i] - .5) * 18) % (W + 80), y = (R4[i] * (H + 80) - tt * (8 + R2[i] * 22)) % (H + 80);
    o[0] = (x < 0 ? x + W + 80 : x) - 40; o[1] = (y < 0 ? y + H + 80 : y) - 40;
  };
  if (t < 34.5) { burst(t, out); return; }
  if (t < 36.5) { const a = [0, 0], b = [0, 0]; burst(t, a); ambient(t, b); const e = easeInOutCubic((t - 34.5) / 2); out[0] = lerp(a[0], b[0], e); out[1] = lerp(a[1], b[1], e); return; }
  ambient(t, out);
}

/* ——— canvases ——— */
const bg = document.getElementById('bg'), g = bg.getContext('2d');
const post = document.getElementById('post'), pg = post.getContext('2d');
const small = document.createElement('canvas'); small.width = 480; small.height = 270; const sg = small.getContext('2d');
const cam = document.getElementById('cam');
function sprite(rgb) { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.2, `rgba(${rgb},.65)`); gr.addColorStop(.5, `rgba(${rgb},.16)`); gr.addColorStop(1, `rgba(${rgb},0)`); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c; }
const SPRITES = [sprite('255,206,120'), sprite('110,228,212'), sprite('255,248,232')];
const STROKES = ['rgba(255,206,120,', 'rgba(110,228,212,', 'rgba(255,248,232,'];
const GRAIN = [0, 1, 2, 3].map(k => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), d = x.createImageData(256, 256), r = mulberry32(900 + k); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });

/* ——— scene DOM ——— */
const D = {};
function buildDom() {
  const L = name => el('div', 'layer', stage), cue = C;
  D.hist = L();
  D.opening = split(el('div', 'center serif', D.hist), cue.opening.line); D.opening.id = 'opening';
  D.histLines = cue.history.map(h => split(el('div', 'center serif histLine', D.hist), h.line));

    const sa = t * sp * 1.6 + ri * 2; g.globalCompositeOperation = 'lighter'; g.drawImage(SPRITES[2], cx + Math.cos(sa) * rx - 18, cy + Math.sin(sa) * ry - 18, 36, 36); g.globalCompositeOperation = 'source-over';
  });
  items.sort((a, b) => a.z - b.z);
  const core = () => { g.globalAlpha = v; g.shadowColor = '#f4b942'; g.shadowBlur = 50; g.fillStyle = 'rgba(30,26,14,.95)'; g.strokeStyle = '#ffe3a6'; g.lineWidth = 2; g.beginPath(); g.roundRect(cx - 50, cy - 130, 100, 122, 14); g.fill(); g.stroke(); g.shadowBlur = 0; g.fillStyle = '#ffe3a6'; g.font = '700 30px "Noto Serif CJK SC"'; g.textAlign = 'center'; g.fillText('问卷', cx, cy - 46); g.fillStyle = 'rgba(255,227,166,.5)'; for (let l = 0; l < 4; l++) g.fillRect(cx - 30, cy - 112 + l * 9, 60, 2); };
  let drawn = false;
  for (const it of items) { if (!drawn && it.z > 0) { core(); drawn = true; } persona(it.x, it.y, 1.35 + it.z * .25, it.hue, v * (.75 + .25 * (it.z + 1) / 2)); }
  if (!drawn) core();
  g.restore();
}

/* ——— gate bursts ——— */
function drawGateFx(t) {
  C.gates.forEach((gt, i) => {
    const tau = t - gt.t - .2; if (tau < 0 || tau > 1.4) return;
    const x = GATE_X(i), y = 475;
    g.save(); g.globalCompositeOperation = 'lighter';
    const p = tau / 1.1; if (p < 1) { g.globalAlpha = (1 - p) * .9; g.strokeStyle = '#ffe3a6'; g.shadowColor = '#f4b942'; g.shadowBlur = 40; g.lineWidth = 2 + 16 * (1 - p); g.beginPath(); g.arc(x, y, 80 + easeOutExpo(p) * 520, 0, Math.PI * 2); g.stroke(); }
    g.shadowBlur = 0;
    const r = mulberry32(700 + i);
    for (let k = 0; k < 90; k++) { const a = r() * Math.PI * 2, sp = 260 + r() * 900, life = .5 + r() * .8; if (tau > life) continue; const d = sp * tau * (1 - tau / (2 * life)), s = 4 + r() * 10; g.globalAlpha = 1 - tau / life; g.drawImage(SPRITES[r() < .8 ? 0 : 2], x + Math.cos(a) * d - s / 2, y + Math.sin(a) * d * .8 - s / 2 + tau * tau * 120, s, s); }
    g.restore();
  });
}

/* ——— bloom ——— */
function bloom(t) {
  if (t > 66) return;
  sg.globalCompositeOperation = 'source-over'; sg.filter = 'blur(5px)'; sg.clearRect(0, 0, 480, 270); sg.drawImage(bg, 0, 0, 480, 270); sg.filter = 'none';
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = t < 30 ? .85 : .6; g.drawImage(small, 0, 0, W, H); g.restore();
}

/* ——— DOM per frame ——— */
function updateDom(t) {
  const cue = C;
  // history
  const histOn = t < 15.2; show(D.hist, histOn);
  if (histOn) {
    lineFx(D.opening, t, cue.opening.t, 2.1, { stagger: .12, dur: .9 });
    cue.history.forEach((h, k) => {
      const next = k < 3 ? cue.history[k + 1].t : cue.title.t;
      lineFx(D.histLines[k], t, h.t + .55, next - .45, { stagger: .06 });
      lineFx(D.histEras[k], t, h.t + .9, next - .4, { stagger: .02, dy: 12, blur: 8 });
      const yv = env(t, h.t + .3, next - .1, .8, .4); D.years[k].style.visibility = yv > 0 ? 'visible' : 'hidden'; D.years[k].style.opacity = (yv * .9).toFixed(3); D.years[k].style.transform = `translateX(${(-(t - h.t) * 18).toFixed(1)}px)`;
    });
    lineFx(D.titleSource, t, cue.title.t + .9, 14.7, { stagger: .03, dy: 14, blur: 8 });
  }
  // today
  const todayOn = t > 15 && t < 29; show(D.today, todayOn);
  if (todayOn) {
    cue.today.slice(0, 4).forEach((h, k) => lineFx(D.todayLines[k], t, h.t + .35, h.t + 2.15, { stagger: .04 }));
    lineFx(D.answer, t, cue.today[4].t + .4, 28.1, { stagger: .14, dur: 1.1, blur: 18 });
  }
  // logo
  const logoOn = t >= 30 && t < 35.6; show(D.logo, logoOn);
  if (logoOn) {
    const m = fadeFx(D.logoMark, t, 30.15, 35.1, { fin: .7, dy: 0, blur: 16, extra: `scale(${(1.25 - .25 * easeOutExpo(clamp((t - 30.15) / 1.2))).toFixed(3)})` });
    lineFx(D.logoWord, t, 30.05, 35.1, { stagger: .12, dur: 1, dy: 60, blur: 24 });
    D.logoWord.style.backgroundPosition = `${((t - 30) * 18) % 200}% 0`;
    lineFx(D.logoLatin, t, 30.6, 35.1, { stagger: .07, dy: 10 });
    lineFx(D.tagline, t, cue.tagline, 35.1, { stagger: .05 });
    void m;
  }
  // chain
  const chainOn = t > 34.6 && t < 38.2; show(D.chain, chainOn);
  if (chainOn) { lineFx(D.chainTitle, t, 34.8, 37.6, { stagger: .03 }); D.chainLabels.forEach((n, k) => fadeFx(n, t, cue.chain[k] + .05, 37.6, { fin: .4, fout: .4, dy: 16 })); }
  // product shots
  D.shots.forEach((s, k) => {
    const a = s.cue.t, b = s.cue.end, on = t > a - .1 && t < b + .3; show(s.layer, on);
    if (!on) return;
    const pin = easeOutExpo(clamp((t - a) / 1.5)), pout = easeInCubic(clamp((t - (b - .35)) / .6)), drift = (t - a) / (b - a);
    const side = k === 0 ? 1 : 1;
    const x = 650 + (1 - pin) * 700 * side - pout * 900, z = -1900 * (1 - pin) - pout * 1200, ry = -40 * (1 - pin) - 10 + drift * 5 - pout * 30, rx = 8 * (1 - pin) + 4;
    s.win.style.left = '0px'; s.win.style.top = k === 0 ? '170px' : '190px';
    s.win.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${(1 + drift * .03).toFixed(4)})`;
    s.win.style.opacity = (clamp((t - a) / .4) * (1 - pout)).toFixed(3);
    s.sweep.style.backgroundPosition = `${(120 - ((t - a) * 55) % 260).toFixed(1)}% 0`;
    show(s.copy, true);
    const kick = s.copy.firstElementChild, tag = s.copy.querySelectorAll('.tag,.chip');
    fadeFx(kick, t, a + .25, b - .25, { fin: .5, fout: .35 });
    s.lines.forEach((ln, j) => lineFx(ln, t, a + .45 + j * .35, b - .3, { stagger: .04 }));
    tag.forEach((n, j) => fadeFx(n, t, a + 1.3 + j * .3, b - .3, { fin: .5, fout: .35, dy: 10 }));
  });
  // cuts
  let cutOn = false;
  D.cuts.forEach((c, k) => {
    const a = c.cue.t, b = k < D.cuts.length - 1 ? D.cuts[k + 1].cue.t : 50.05, on = t >= a && t < b; show(c.layer, on);
    if (!on) return; cutOn = true;
    const p = (t - a) / (b - a), s = 1.12 - .12 * easeOutCubic(p);
    c.win.style.transform = `scale(${s.toFixed(4)}) rotate(${((k % 2 ? 1 : -1) * (1 - easeOutCubic(p)) * 1.5).toFixed(2)}deg)`;
    c.label.style.transform = `translateX(${((1 - easeOutCubic(clamp(p * 2))) * -60).toFixed(1)}px)`;
    c.label.style.opacity = easeOutCubic(clamp(p * 3)).toFixed(3);
  });
  show(D.cutTag, cutOn);
  // gates
  const gatesOn = t > 49.9 && t < 60.3; show(D.gates, gatesOn);
  if (gatesOn) {
    lineFx(D.gatesKicker, t, 50.0, 59.8, { stagger: .04 });
    cue.gates.forEach((gt, i) => {
      const tau = t - gt.t, s = D.seals[i], nm = D.sealNames[i];
      if (tau < 0 || t > 60.2) { show(s, false); show(nm, false); return; }
      show(s, true); show(nm, true);
      const p = clamp(tau / .2), land = easeInCubic(p), bounce = tau > .2 ? Math.exp(-(tau - .2) * 10) * Math.sin((tau - .2) * 38) * .06 : 0;
      const sc = (2.8 - 1.8 * land) * (1 + bounce), rot = -16 * (1 - land) - 3 + (i % 2 ? 2 : -1) * land;
      s.style.transform = `scale(${sc.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
      s.style.opacity = Math.min(1, p * 3).toFixed(3);
      s.style.filter = p < 1 ? `blur(${((1 - p) * 10).toFixed(1)}px)` : 'none';
      const out = clamp((t - 59.7) / .5); s.style.opacity = (Math.min(1, p * 3) * (1 - out)).toFixed(3);
      nm.style.opacity = (clamp((tau - .25) / .4) * (1 - out)).toFixed(3);
    });
    lineFx(D.gatesCaption, t, cue.gatesCaption + .1, 59.75, { stagger: .04 });
  }
  // integrity
  const vowOn = t > 59.9 && t < 65.2; show(D.vows, vowOn);
  if (vowOn) D.vowLines.forEach((n, i) => {
    const a = cue.integrity[i].t; lineFx(n, t, a, 64.6, { stagger: .05, dur: .5, dy: 0, blur: 20 });
    n._bar.style.width = (easeOutCubic(clamp((t - a - .3) / .7)) * n.offsetWidth * .98).toFixed(1) + 'px';
    n._bar.style.opacity = (1 - clamp((t - 64.6) / .45)).toFixed(3);
  });
  // dawn
  const dawnOn = t > 65.4 && t < 73.2; show(D.dawn, dawnOn);
  if (dawnOn) {
    const mv = env(t, 66.9, 72.8, 1.6, .6), e = easeOutCubic(mv);
    D.mascot.style.opacity = e.toFixed(3);
    D.mascot.style.transform = `translateY(${((1 - e) * 60 + Math.sin(t * .9) * 8).toFixed(1)}px) scale(${(.94 + .06 * e + (t - 66.9) * .004).toFixed(4)})`;
    lineFx(D.dawn1, t, cue.finale[0].t, 72.6, { stagger: .1, dur: .9 });
    lineFx(D.dawn2, t, cue.finale[1].t, 72.6, { stagger: .05 });
  }
  // end card
  const endOn = t > cue.endCard; show(D.end, endOn);
  if (endOn) {
    const a = cue.endCard;
    fadeFx(D.endMark, t, a + .2, 99, { fin: .8, dy: 20 });
    fadeFx(D.endWord, t, a + .45, 99, { fin: .9, dy: 30, blur: 14 });
    fadeFx(D.endLatin, t, a + .75, 99, { fin: .8, dy: 10 });
    fadeFx(D.endTag, t, a + 1.1, 99, { fin: .9, dy: 16 });
    fadeFx(D.endMotto, t, a + 1.5, 99, { fin: .9, dy: 10 });
    fadeFx(D.endDisclaimer, t, a + 1.9, 99, { fin: .8, dy: 0, blur: 4 });
    fadeFx(D.endNotes, t, a + 2.2, 99, { fin: .8, dy: 0, blur: 4 });
  }
}

/* ——— camera ——— */
function shake(t) {
  const hits = [[C.logo, 26, 3.2]]; C.history.forEach(h => hits.push([h.t, 4, 6])); hits.push([C.title.t, 9, 5]);
  C.gates.forEach((gt, i) => hits.push([gt.t + .2, i < 4 ? 15 : 10, 7])); C.integrity.forEach(v => hits.push([v.t, 7, 7])); C.cuts.forEach(c => hits.push([c.t, 5, 9]));
  let x = 0, y = 0, r = 0;
  for (const [h, A, k] of hits) { const tau = t - h; if (tau < 0 || tau > 1.6) continue; const d = A * Math.exp(-tau * k); x += d * Math.sin(tau * 63 + h); y += d * Math.cos(tau * 57 + h * 2); r += d * .02 * Math.sin(tau * 41); }
  let s = 1;
  if (t < 15) s = 1 + (t % 2.5) * .006; else if (t < 30) s = 1 + (t - 15) * .003; else if (t >= 65) s = 1 + (t - 65) * .002;
  return `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
}

/* ——— post: flash, flare, letterbox, vignette, grain, fades ——— */
function drawPost(t, frameIndex) {
  pg.clearRect(0, 0, W, H);
  // flashes
  const flashes = [[C.logo, .95, .22], [C.title.t, .14, .35]]; C.history.forEach(h => flashes.push([h.t, .07, .3])); C.gates.forEach(gt => flashes.push([gt.t + .2, .16, .18])); C.integrity.forEach(v => flashes.push([v.t, .1, .2])); C.cuts.forEach(c => flashes.push([c.t, .14, .12])); C.chain.forEach(c => flashes.push([c, .05, .15]));
  let f = 0; for (const [h, A, d] of flashes) { const tau = t - h; if (tau >= 0 && tau < d * 4) f += A * Math.exp(-tau / d); }
  if (f > 0) { pg.fillStyle = `rgba(255,246,226,${clamp(f).toFixed(3)})`; pg.fillRect(0, 0, W, H); }
  // anamorphic flare at the logo
  const fl = t >= 29.9 ? (t < 30.4 ? 1 : env(t, 30, 35.2, .01, .8) * .32 * (1 + .15 * Math.sin(t * 9))) : 0;
  if (fl > 0) {
    pg.save(); pg.globalCompositeOperation = 'lighter';
    const lg = pg.createLinearGradient(0, 0, W, 0); lg.addColorStop(0, 'rgba(79,209,193,0)'); lg.addColorStop(.3, `rgba(79,209,193,${.35 * fl})`); lg.addColorStop(.5, `rgba(255,248,232,${.95 * fl})`); lg.addColorStop(.7, `rgba(79,209,193,${.35 * fl})`); lg.addColorStop(1, 'rgba(79,209,193,0)');
    pg.fillStyle = lg; pg.fillRect(0, CY - 2, W, 4); pg.globalAlpha = .35; pg.fillRect(0, CY - 16, W, 32); pg.globalAlpha = .12; pg.fillRect(0, CY - 60, W, 120);
    pg.restore();
  }
  // letterbox opens on the logo hit
  const lb = t < 30 ? 138 : 138 * (1 - easeOutExpo(clamp((t - 30) / .9)));
  if (lb > .5) { pg.fillStyle = '#000'; pg.fillRect(0, 0, W, lb); pg.fillRect(0, H - lb, W, lb); }
  // vignette
  const light = smooth(65.5, 67, t) * (1 - smooth(77.5, 78, t));
  const vg = pg.createRadialGradient(CX, H / 2, H * .35, CX, H / 2, H * 1.05); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${(.62 - .5 * light).toFixed(3)})`); pg.fillStyle = vg; pg.fillRect(0, 0, W, H);
  // grain
  pg.save(); pg.globalAlpha = .045 - .02 * light; const tile = GRAIN[frameIndex % 4], ox = (frameIndex * 37) % 256, oy = (frameIndex * 91) % 256; for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) pg.drawImage(tile, x, y); pg.restore();
  // fade in / out
  const black = Math.max(1 - clamp(t / .8), smooth(C.fadeOut, C.duration - .2, t));
  if (black > 0) { pg.fillStyle = `rgba(0,0,0,${black.toFixed(3)})`; pg.fillRect(0, 0, W, H); }
}

/* ——— entry points ——— */
window.renderFrame = function (t) {
  const frameIndex = Math.round(t * C.fps);
  drawBackground(t);
  drawParticles(t);
  drawEclipse(t);
  drawChain(t);
  drawOrbit(t);
  drawGateFx(t);
  bloom(t);
  cam.style.transform = shake(t);
  updateDom(t);
  drawPost(t, frameIndex);
};
window.ready = (async () => {
  C = await (await fetch('cues.json')).json();
  await Promise.all([document.fonts.load('700 100px "Noto Serif CJK SC"', '卜徵灋證无征不信问卷证见'), document.fonts.load('700 100px "Noto Sans CJK SC"', '？问题'), document.fonts.load('400 100px "Noto Sans CJK SC"', 'EVI-X')]);
  KF = [
    { t: 0, s: null },
    { t: C.history[0].t, d: 1.5, ease: easeOutExpo, swirl: .7, spread: .25 },
    { t: C.history[1].t, d: 1.35 }, { t: C.history[2].t, d: 1.35 }, { t: C.history[3].t, d: 1.35 },
    { t: C.title.t, d: 1.4, swirl: .3 },
    { t: C.today[0].t, d: 1.2, swirl: .5, spread: .4 },
    { t: C.today[1].t, d: 1.0, spread: .3 },
    { t: C.today[2].t, d: 1.0, swirl: .2, spread: .3 },
    { t: C.today[3].t, d: 1.0, spread: .3 },
  ];
  buildShapes();
  const order = ['spark', 'g0', 'g1', 'g2', 'g3', 'title', 'chaos', 'question', 'floor', 'net'];
  KF.forEach((k, i) => { k.s = SHAPES[order[i]]; });
  buildDom();
  await Promise.all([...C.shots, ...C.cuts].map(s => loadImg(s.id, ASSET + `app-${s.id}-1600.webp`)));
  await Promise.all([...document.images].map(i => i.complete ? i.decode().catch(() => {}) : new Promise(r => { i.onload = () => i.decode().then(r, r); i.onerror = r; })));
  window.renderFrame(0);
  return true;
})();
