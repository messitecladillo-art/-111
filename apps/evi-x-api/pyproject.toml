[project]
name = "evix-api"
version = "0.1.0"
description = "Invitation-only EVI-X hosted research API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pyreadstat==1.3.6",
]

[dependency-groups]
dev = [
    "pandas>=2.2,<4",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evix_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires a separately supplied synthetic PostgreSQL URL"]
