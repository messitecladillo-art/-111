[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = WARN
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
