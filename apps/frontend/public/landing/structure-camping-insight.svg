<svg xmlns="http://www.w3.org/2000/svg" width="560" height="792" viewBox="0 0 560 792"><title>原创结构导览：从比较进入群体解释；非报告原页，不承载统计数值</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#407F70" stroke-width="1.4"/></marker></defs><rect width="560" height="792" rx="8" fill="#F7F8F1"/><path d="M34 104H526M34 704H526" stroke="#C9DAD1"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"><text x="36" y="44" text-anchor="start" fill="#407F70" font-size="14" font-weight="600">结构导览</text><text x="524" y="44" text-anchor="end" fill="#52736A" font-size="13" font-weight="400">非报告原页</text><text x="36" y="83" text-anchor="start" fill="#173D39" font-size="23" font-weight="600">重庆短途露营研究</text><text x="36" y="144" text-anchor="start" fill="#173D39" font-size="27" font-weight="600">从比较进入群体解释</text><text x="36" y="182" text-anchor="start" fill="#52736A" font-size="17" font-weight="400">并列人群，在相同维度上阅读差别</text><rect x="36" y="235" width="150" height="315" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="54" y="270" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">第一类人群</text><rect x="51" y="299" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="111" y="327" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">活动偏好</text><rect x="51" y="369" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="111" y="397" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">携带装备</text><rect x="51" y="439" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="111" y="467" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">差异解释</text><rect x="205" y="235" width="150" height="315" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="223" y="270" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">第二类人群</text><rect x="220" y="299" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="280" y="327" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">活动偏好</text><rect x="220" y="369" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="280" y="397" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">携带装备</text><rect x="220" y="439" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="280" y="467" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">差异解释</text><rect x="374" y="235" width="150" height="315" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="392" y="270" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">第三类人群</text><rect x="389" y="299" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="449" y="327" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">活动偏好</text><rect x="389" y="369" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="449" y="397" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">携带装备</text><rect x="389" y="439" width="120" height="45" rx="7" fill="#E8F0E9"/><text x="449" y="467" text-anchor="middle" fill="#173D39" font-size="16" font-weight="400">差异解释</text><text x="36" y="607" text-anchor="start" fill="#173D39" font-size="18" font-weight="400">先看同类比较，再读群体命名与解释。</text><text x="36" y="645" text-anchor="start" fill="#52736A" font-size="14" font-weight="400">卡片尺寸不表示群体规模或统计大小。</text><text x="36" y="735" text-anchor="start" fill="#52736A" font-size="14" font-weight="400">图文组织示意 · 不承载统计数值</text><text x="36" y="765" text-anchor="start" fill="#52736A" font-size="12" font-weight="400">原文定位：印刷页 46 · 可在案例库本地阅读</text></g></svg>