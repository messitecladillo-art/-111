<svg xmlns="http://www.w3.org/2000/svg" width="560" height="792" viewBox="0 0 560 792"><title>原创结构导览：问题如何找到切口；非报告原页，不承载统计数值</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#407F70" stroke-width="1.4"/></marker></defs><rect width="560" height="792" rx="8" fill="#F7F8F1"/><path d="M34 104H526M34 704H526" stroke="#C9DAD1"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"><text x="36" y="44" text-anchor="start" fill="#407F70" font-size="14" font-weight="600">结构导览</text><text x="524" y="44" text-anchor="end" fill="#52736A" font-size="13" font-weight="400">非报告原页</text><text x="36" y="83" text-anchor="start" fill="#173D39" font-size="23" font-weight="600">重庆短途露营研究</text><text x="36" y="144" text-anchor="start" fill="#173D39" font-size="27" font-weight="600">问题如何找到切口</text><text x="36" y="182" text-anchor="start" fill="#52736A" font-size="17" font-weight="400">从参与现状，走向可研究的顾虑</text><rect x="36" y="225" width="228" height="112" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="54" y="260" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">已经参与</text><text x="54" y="290" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">观察行为与出行安排</text><rect x="296" y="225" width="228" height="112" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="314" y="260" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">尚未参与</text><text x="314" y="290" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">辨认未参与的原因</text><path d="M150 349 L215 394" stroke="#407F70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M410 349 L345 394" stroke="#407F70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="100" y="407" width="360" height="92" rx="13" fill="#E8F0E9" stroke="#C9DAD1"/><text x="118" y="442" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">具体顾虑与研究切入点</text><text x="118" y="472" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">同伴、装备等问题如何进入调查</text><text x="36" y="568" text-anchor="start" fill="#407F70" font-size="14" font-weight="600">页面组织</text><text x="36" y="607" text-anchor="start" fill="#173D39" font-size="19" font-weight="400">现状图形  →  原因图形  →  问题归纳</text><text x="36" y="645" text-anchor="start" fill="#52736A" font-size="14" font-weight="400">这里展示阅读顺序，不复刻原图及其比例。</text><text x="36" y="735" text-anchor="start" fill="#52736A" font-size="14" font-weight="400">图文组织示意 · 不承载统计数值</text><text x="36" y="765" text-anchor="start" fill="#52736A" font-size="12" font-weight="400">原文定位：印刷页 32 · 可在案例库本地阅读</text></g></svg>