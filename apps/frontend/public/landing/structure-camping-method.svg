<svg xmlns="http://www.w3.org/2000/svg" width="560" height="792" viewBox="0 0 560 792"><title>原创结构导览：用路线串联研究；非报告原页，不承载统计数值</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#407F70" stroke-width="1.4"/></marker></defs><rect width="560" height="792" rx="8" fill="#F7F8F1"/><path d="M34 104H526M34 704H526" stroke="#C9DAD1"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"><text x="36" y="44" text-anchor="start" fill="#407F70" font-size="14" font-weight="600">结构导览</text><text x="524" y="44" text-anchor="end" fill="#52736A" font-size="13" font-weight="400">非报告原页</text><text x="36" y="83" text-anchor="start" fill="#173D39" font-size="23" font-weight="600">重庆短途露营研究</text><text x="36" y="144" text-anchor="start" fill="#173D39" font-size="27" font-weight="600">用路线串联研究</text><text x="36" y="182" text-anchor="start" fill="#52736A" font-size="17" font-weight="400">研究路线连接资料、工具与分析</text><rect x="65" y="222" width="430" height="106" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="83" y="257" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">文献与网络资料</text><text x="83" y="287" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">厘清问题，准备调查线索</text><path d="M280 340 L280 365" stroke="#407F70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="65" y="377" width="430" height="106" rx="13" fill="#E8F0E9" stroke="#C9DAD1"/><text x="83" y="412" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">问卷迭代与实地调查</text><text x="83" y="442" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">让调查工具与研究问题对应</text><path d="M280 495 L280 520" stroke="#407F70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="65" y="532" width="430" height="106" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="83" y="567" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">分析比较与解释</text><text x="83" y="597" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">把调查所得组织为研究判断</text><text x="36" y="735" text-anchor="start" fill="#52736A" font-size="14" font-weight="400">图文组织示意 · 不承载统计数值</text><text x="36" y="765" text-anchor="start" fill="#52736A" font-size="12" font-weight="400">原文定位：印刷页 3 · 可在案例库本地阅读</text></g></svg>