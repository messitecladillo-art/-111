<svg xmlns="http://www.w3.org/2000/svg" width="560" height="792" viewBox="0 0 560 792"><title>原创结构导览：读数据前先认清样本；非报告原页，不承载统计数值</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#407F70" stroke-width="1.4"/></marker></defs><rect width="560" height="792" rx="8" fill="#F7F8F1"/><path d="M34 104H526M34 704H526" stroke="#C9DAD1"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"><text x="36" y="44" text-anchor="start" fill="#407F70" font-size="14" font-weight="600">结构导览</text><text x="524" y="44" text-anchor="end" fill="#52736A" font-size="13" font-weight="400">非报告原页</text><text x="36" y="83" text-anchor="start" fill="#173D39" font-size="23" font-weight="600">重庆短途露营研究</text><text x="36" y="144" text-anchor="start" fill="#173D39" font-size="27" font-weight="600">读数据前先认清样本</text><text x="36" y="182" text-anchor="start" fill="#52736A" font-size="17" font-weight="400">先说明样本组成，再理解后续判断</text><rect x="36" y="230" width="488" height="98" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="54" y="265" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">性别构成</text><text x="54" y="295" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">说明受访者的分类组成</text><rect x="36" y="357" width="488" height="98" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="54" y="392" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">年龄构成</text><text x="54" y="422" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">交代调查覆盖的人群范围</text><rect x="36" y="484" width="488" height="98" rx="13" fill="#FFFFFF" stroke="#C9DAD1"/><text x="54" y="519" text-anchor="start" fill="#173D39" font-size="20" font-weight="600">职业构成</text><text x="54" y="549" text-anchor="start" fill="#52736A" font-size="15" font-weight="400">提示结论适用的具体情境</text><text x="36" y="642" text-anchor="start" fill="#407F70" font-size="19" font-weight="400">样本画像  →  比较口径  →  解释范围</text><text x="36" y="735" text-anchor="start" fill="#52736A" font-size="14" font-weight="400">图文组织示意 · 不承载统计数值</text><text x="36" y="765" text-anchor="start" fill="#52736A" font-size="12" font-weight="400">原文定位：印刷页 30 · 可在案例库本地阅读</text></g></svg>